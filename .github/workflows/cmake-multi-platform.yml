
name: Multi-Platform Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc

          - os: ubuntu-latest
            compiler: clang

          - os: windows-latest
            compiler: cl

          - os: macos-latest
            compiler: clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

  # 1. Configure your existing CMake project
      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S .

  # 2. Build the static library
      - name: Build Static Library
        run: cmake --build build --config Release --parallel

  # 3. Compile unit tests and link static library
      - name: Compile Unit Tests
        shell: bash
        run: |
          mkdir -p build/unit_tests

          ${{ matrix.compiler == 'cl' && 'gcc' || matrix.compiler }} \
            -Iinclude \
            unit_tests/*.c \
            unit_tests/entry/main.c \
            liboxb1tz.a \
            -o build/unit_tests/unit_tests

    # 4. Run unit tests
      - name: Run Unit Tests
        shell: bash
        run: ./build/unit_tests/unit_tests

