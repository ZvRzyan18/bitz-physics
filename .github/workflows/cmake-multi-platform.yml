
name: Multi-Platform Unit Tests

on:
  push:
    branches:
     - '**'
  pull_request:
    branches:
     - '**'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            mode : OXB_SIMD

          - os: ubuntu-latest
            compiler: gcc
            mode : OXB_SCALAR

          - os: ubuntu-latest
            compiler: clang
            mode : OXB_SIMD

          - os: ubuntu-latest
            compiler: clang
            mode : OXB_SCALAR

          - os: windows-latest
            compiler: cl
            mode : OXB_SIMD

          - os: windows-latest
            compiler: cl
            mode : OXB_SCALAR

          - os: macos-latest
            compiler: clang
            mode : OXB_SIMD

          - os: macos-latest
            compiler: clang
            mode : OXB_SCALAR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSVC
        if: matrix.compiler == 'cl'
        uses: ilammy/msvc-dev-cmd@v1
        with:
         arch: x64

  # 1. Configure your existing CMake project
      - name: Configure CMake
        shell: bash
        run: |
         MODE_DEFINE="${{ matrix.mode }}"
         if [[ "${{ matrix.compiler }}" == "cl" ]]; then
          MSYS_NO_PATHCONV=1 cmake -B build -S . \
          -DCMAKE_C_COMPILER=cl \
          -DCMAKE_C_FLAGS="/DOXB_TEST /D$MODE_DEFINE" \
          -DCMAKE_BUILD_TYPE=Debug
         else
          cmake -B build -S . \
          -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_C_FLAGS="-DOXB_TEST -D$MODE_DEFINE" \
          -DCMAKE_BUILD_TYPE=Debug
         fi
  # 2. Build the static library
      - name: Build Static Library
        run: cmake --build build --config Release --parallel
      - name: Find Static Library
        shell: bash
        run: |
          find build -type f \( -name "*.a" -o -name "*.lib" \)
    
  # 3. Compile unit tests and link static library
      - name: Compile Unit Tests
        shell: bash
        run: |
          MODE_DEFINE="${{ matrix.mode }}"
          mkdir -p build/unit_tests
          if [[ "${{ matrix.compiler }}" == "cl" ]]; then
          
           STATIC_LIB="build/Release/oxb1tz.lib"
           MSYS_NO_PATHCONV=1 ${{ matrix.compiler }} \
           /nologo \
           /MDd \
           /I"$GITHUB_WORKSPACE/include" \
           /DOXB_TEST /D$MODE_DEFINE \
           unit_tests/entry/main.c \
           "$STATIC_LIB" \
           /Febuild/unit_tests/unit_tests.exe
           
          else
          
           STATIC_LIB="build/liboxb1tz.a"
           ${{ matrix.compiler }} \
           -I include \
           -DOXB_TEST -DMODE_DEFINE \
           unit_tests/entry/main.c \
           "$STATIC_LIB" \
           -lm \
           -o build/unit_tests/unit_tests
           
          fi
          
    # 4. Run unit tests
      - name: Run Unit Tests
        shell: bash
        run: | 
         if [[ "${{ matrix.compiler }}" == "cl" ]]; then
          echo "-->> WINDOWS UNIT TESTS"
          date
          ./build/unit_tests/unit_tests.exe
          echo "-->> WINDOWS UNIT TESTS"
          date
         else
          ./build/unit_tests/unit_tests
         fi

